# This workflow will build a Swift project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-swift

name: Swift

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4
    - name: Build
      run: xcodebuild -project Clarify.xcodeproj -target Clarify -configuration Debug -sdk iphonesimulator -destination 'platform=iOS Simulator,name=iPhone 17,OS=26.5' CODE_SIGNING_ALLOWED=NO build
    - name: Run tests
      run: |
        if grep -Eq 'com\.apple\.product-type\.bundle\.(unit-test|ui-testing)' Clarify.xcodeproj/project.pbxproj; then
          xcodebuild -project Clarify.xcodeproj -scheme Clarify -configuration Debug -sdk iphonesimulator -destination 'platform=iOS Simulator,name=iPhone 17,OS=26.5' CODE_SIGNING_ALLOWED=NO test
        else
          echo "No Xcode test targets configured; skipping tests."
        fi
